name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN (fine-grained PAT) is REQUIRED, not optional:
      # releases created with github.token do NOT emit the `release:published`
      # event (GitHub anti-recursion), which breaks the Pages deploy trigger.
      # If this secret expires -> "Bad credentials" failures. Renew it before
      # it does; the fallback token cannot trigger downstream workflows.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
